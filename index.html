<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="AE Check"/>
  <meta name="theme-color" content="#0F1923"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <title>AE Check</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{height:100%;background:#0F1923}
    body{
      min-height:100vh;min-height:100dvh;background:#0F1923;
      font-family:'DM Sans','Segoe UI',sans-serif;
      -webkit-tap-highlight-color:transparent;overflow-x:hidden;
    }
    #root{min-height:100vh;min-height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
    *{scrollbar-width:none;-ms-overflow-style:none}
    *::-webkit-scrollbar{display:none}
    button,input,select,textarea{touch-action:manipulation;font-family:inherit}
    #splash{
      position:fixed;inset:0;background:#0F1923;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
      z-index:9999;transition:opacity .5s ease;
    }
    #splash.hidden{opacity:0;pointer-events:none}
    #splash-icon{width:96px;height:96px;border-radius:22px;overflow:hidden}
    #splash-icon img{width:100%;height:100%}
    #splash-title{color:#00C2FF;font-size:26px;font-weight:900;letter-spacing:3px}
    .spinner{width:36px;height:36px;border:3px solid #2A3E55;border-top-color:#00C2FF;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="splash">
    <div id="splash-icon"><img src="icon-192.png" alt="AE Check"/></div>
    <div id="splash-title">AE CHECK</div>
    <div class="spinner"></div>
  </div>
  <div id="root"></div>

  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
  </script>
